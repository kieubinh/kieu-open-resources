<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kieu Resources</title>
<style>body{font:16px system-ui;max-width:1050px;margin:3rem auto;padding:0 1rem;background:#f5f7fb;color:#17233b}h1{font-size:2.4rem}label{display:block;margin:1rem 0}input,select,button{font:inherit;padding:.6rem;border:1px solid #b8c3d3;border-radius:.5rem}input{max-width:100%;width:32rem}button{cursor:pointer;background:#154db6;color:white}button:disabled{opacity:.5}.panel,.card{background:white;border:1px solid #dae1ec;border-radius:1rem;padding:1.2rem;margin:1rem 0}pre{white-space:pre-wrap;word-break:break-word;background:#edf2fa;padding:1rem;max-height:25rem;overflow:auto}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.muted{color:#52627a}#error{color:#a01818}</style>
<main><h1>Kieu Resources</h1><p class="muted">Approved resources with documented provenance. Discovery never runs examples or downloads datasets.</p>
<div class="panel"><label>Read-only credential <input id="token" type="password" autocomplete="off" placeholder="Paste your read token"></label><label>Search <input id="query" placeholder="Vietnamese document QA"></label><label>Kind <select id="kind"><option value="">All</option><option>dataset</option><option>model</option><option>framework</option><option>skill</option><option>tool</option><option>asset</option></select></label><label>Collection <input id="collection" placeholder="Optional collection name"></label><button id="search">Search approved resources</button><p id="error" role="alert"></p></div><section id="results"></section><section id="detail" class="panel" hidden></section></main>
<script>
const $=id=>document.getElementById(id); let selected;
async function api(operation,arguments_={}){const response=await fetch('/v1/operations',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},body:JSON.stringify({operation,arguments:arguments_})});const body=await response.json();if(!body.ok)throw Error(body.error.code+': '+body.error.message);return body.value}
function showError(e){$('error').textContent=String(e.message||e)}
async function search(){try{$('error').textContent='';$('results').replaceChildren();$('detail').hidden=true;const items=await api('search_resources',{query:$('query').value,kind:$('kind').value||undefined,collection:$('collection').value||undefined});for(const item of items){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=item.title;const info=document.createElement('p');info.textContent=`${item.kind} · ${item.id} · ${item.revision}`;const button=document.createElement('button');button.textContent='Inspect';button.onclick=()=>inspect(item.id);card.append(title,info,button);$('results').append(card)}if(!items.length)$('results').textContent='No approved matches.'}catch(e){showError(e)}}
async function inspect(id){try{$('error').textContent='';selected=await api('get_resource',{resource_id:id});const box=$('detail');box.replaceChildren();box.hidden=false;const h=document.createElement('h2');h.textContent=selected.title;const summary=document.createElement('p');summary.textContent=selected.description;const actions=document.createElement('div');actions.className='actions';const output=document.createElement('pre');function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{output.textContent=JSON.stringify(await fn(),null,2)}catch(e){showError(e)}};actions.append(b)}button('License review',()=>api('check_usage_rights',{resource_id:id,operation:'research'}));button('Copy Quick Start',async()=>{const result=await api('get_quick_start',{resource_id:id});await navigator.clipboard.writeText(JSON.stringify(result,null,2));return result});if(selected.kind==='dataset')button('Preview sample',()=>api('preview_dataset',{resource_id:id,limit:3}));button('History',()=>api('get_resource_history',{resource_id:id}));if(selected.colab_url){const link=document.createElement('a');link.href=selected.colab_url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open in Colab';actions.append(link)}box.append(h,summary,actions,output)}catch(e){showError(e)}}
$('search').onclick=search;
</script></html>
