name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Validate registry
        run: kieu-open-resources validate --registry registry
      - name: Unit, integration and security tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t tests -v
      - name: LeetCode #10 reference tests
        run: python examples/leetcode-10-regular-expression-matching/scripts/solution_test.py
      - name: Packaged skill matches canonical skill
        run: diff -r skills/kieu-resource-discovery src/kieu_open_resources/skills/kieu-resource-discovery
